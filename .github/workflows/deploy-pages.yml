name: Publicar PetCare en GitHub Pages

# Se ejecuta cuando hacemos cambios en la rama main
on:
  push:
    branches: ["main"]

  # También permite ejecutarlo manualmente desde Actions
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Instala Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "petcare-simple/package-lock.json"

      # Instala las dependencias del proyecto
      - name: Instalar dependencias
        working-directory: "petcare-simple"
        run: npm ci

      # Compila React + Vite para GitHub Pages
      - name: Compilar proyecto
        working-directory: "petcare-simple"
        run: npm run build -- --base=/petcare-frontend/

      # Prepara GitHub Pages
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Sube la carpeta generada por Vite
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "petcare-simple/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # Publica el sitio en GitHub Pages
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
